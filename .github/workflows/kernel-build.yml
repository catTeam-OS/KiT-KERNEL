name: KiT Kernel Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout KiT
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            dwarves \
            zstd \
            kmod

      - name: Load KiT configuration
        run: |
          cp kernel/config/kit_defconfig kernel/source/linux/.config

      - name: Resolve kernel configuration
        run: |
          make -C kernel/source/linux olddefconfig

      - name: Build kernel and modules
        run: |
          make -C kernel/source/linux -j"$(nproc)" bzImage modules

      - name: Install modules into staging directory
        run: |
          make -C kernel/source/linux \
            INSTALL_MOD_PATH="$RUNNER_TEMP/kit-staging" \
            modules_install

      - name: Collect kernel artifacts
        run: |
          KERNEL_DIR="kernel/source/linux"
          KERNEL_RELEASE="$(make -s -C "$KERNEL_DIR" kernelrelease)"
          ARTIFACT_DIR="$RUNNER_TEMP/kit-artifacts"

          mkdir -p "$ARTIFACT_DIR/boot"

          cp "$KERNEL_DIR/arch/x86/boot/bzImage" \
            "$ARTIFACT_DIR/boot/vmlinuz-$KERNEL_RELEASE"

          cp "$KERNEL_DIR/System.map" "$ARTIFACT_DIR/boot/"
          cp "$KERNEL_DIR/.config" "$ARTIFACT_DIR/boot/"

          cp -a "$RUNNER_TEMP/kit-staging/lib/modules" \
            "$ARTIFACT_DIR/"

          printf '%s\n' "$KERNEL_RELEASE" \
            > "$ARTIFACT_DIR/boot/kernel-release.txt"

          tar -C "$ARTIFACT_DIR" \
            -czf "$RUNNER_TEMP/kit-kernel-x86_64.tar.gz" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kit-kernel-x86_64
          path: ${{ runner.temp }}/kit-kernel-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
